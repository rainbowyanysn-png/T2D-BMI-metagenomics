schema_version: 1
reference: submission and the two 20260705 plotting scripts; appearance only
font_family: Times New Roman
figure:
  font_family: Times New Roman
  font_size: 12
  line_width: 0.55
  panel_font_size: 10
  forest_label_size: 9
groups:
  order: [NC, OC, NT2D, OT2D]
  fill: {NC: '#2166AC', OC: '#92C5DE', NT2D: '#F4A582', OT2D: '#B2182B'}
  dark: {NC: '#17477A', OC: '#4189A5', NT2D: '#BE6524', OT2D: '#810E1C'}
  total: {Ctrl: '#2166AC', T2D: '#C85A5A'}
  total_dark: {Ctrl: '#17477A', T2D: '#8B3E3E'}
volcano:
  colours: {Enriched: '#B2182B', Depleted: '#2166AC', NS: '#CFD8DC'}
  facet_scales: free
heatmap:
  low: '#72BCD5'
  mid: '#FBFAFE'
  high: '#F7AA58'
beta:
  ellipse_type: t
  ellipse_level: 0.95
  ellipse_linewidth: 0.7
  point_size: 2.2
  point_alpha: 0.55
  cohort_shapes: [16, 17, 15, 3, 7]
table:
  enabled: true
  font_size: 11
  header_fill: '#F2F2F2'
  header_font_colour: '#000000'
  numeric_format: '0.0000'
  probability_format: '0.000E+00'
  numeric_tolerance: 1.0e-08
